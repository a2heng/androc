// Androc — one app, three capability tiers (UI / kernel pack / tools pack).
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Androc"

// Layering (see docs/series.md):
//   :contracts  stable API shared by every layer
//   :kernel     proot engine, server lifecycle, packs, pairing
//   :tools      Android build chain and device API for the agent
//   :ui         Compose client; never starts a process
//   :app        the one application (thin/full flavors in phase 4)
include(":app")
include(":contracts")
include(":kernel")
include(":tools")
include(":ui")
include(":market")
include(":plugin-sdk")
include(":runtime-plugin")
