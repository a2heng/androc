// Androc：一个 App，两个发行版（thin / bundle）。
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}
rootProject.name = "Androc"

// 分层见 docs/series.md：
//   :contracts  各层共用的稳定 API
//   :ui         Compose 客户端
//   :app        thin / bundle 两个发行版
//   :market     市场客户端（签名索引、下载、解压）
//   :plugin-sdk / :runtime-plugin  插件与运行时扩展
include(":app")
include(":contracts")
include(":ui")
include(":market")
include(":plugin-sdk")
include(":runtime-plugin")
