plugins {
    id 'com.android.application'
}

// The bundled opencode version has one source of truth: opencode.version.
// Release CI refuses to build when this is older than the latest upstream tag.
def opencodeVersion = rootProject.file("opencode.version").text.trim()
if (!opencodeVersion) {
    throw new GradleException("opencode.version is empty")
}

// CI passes -PandrocVersionName / -PandrocVersionCode / -PandrocRequireSigning.
// The old -Padia* names are still accepted so an existing release job keeps working.
def androcVersionCode = (findProperty("androcVersionCode")
        ?: findProperty("adiaVersionCode") ?: "9").toInteger()
def androcVersionName = findProperty("androcVersionName")
        ?: findProperty("adiaVersionName") ?: "0.6.0-androc"
def androcRequireSigning = (findProperty("androcRequireSigning")
        ?: findProperty("adiaRequireSigning")) == "1"

android {
    namespace 'com.a2heng.androc'
    compileSdk 37

    defaultConfig {
        applicationId "com.a2heng.androc"
        minSdk 26
        targetSdk 34
        versionCode androcVersionCode
        versionName androcVersionName
        buildConfigField "int", "SERVER_PORT", "4096"
        // Version del binario empaquetado en jniLibs. Fuente unica:
        // opencode.version (lo verifica scripts/check-opencode-latest.py).
        buildConfigField "String", "OPENCODE_VERSION", "\"${opencodeVersion}\""
        // Un solo runtime: proot. No hay buildConfigField de modo.
        // UI por defecto: mobile = frontend Compose embebido (:ui);
        // web = WebView clasico (solo como respaldo).
        def androcUi = (findProperty("androcUi")
                ?: findProperty("adiaUi") ?: "mobile").toString()
        buildConfigField "String", "UI_MODE", "\"${androcUi}\""
        // v1: canal 4.x del launcher y runtime opencode 1.x.
        buildConfigField "boolean", "V2", "false"
        ndk {
            abiFilters 'arm64-v8a'
        }
        // 插件签名权限的包名。debug 用自己的名字，避免和已安装的正式版
        // （签名不同）声明同一个 signature 权限导致 INSTALL_FAILED_DUPLICATE_PERMISSION。
        manifestPlaceholders["pluginPermission"] = "com.a2heng.androc.permission.PLUGIN"
    }

    // Firma release: CI usa variables de entorno; local puede usar
    // keystore.properties (no versionado). Sin ninguno, debug sigue compilando.
    def keystoreProps = new Properties()
    def keystoreFile = rootProject.file("keystore.properties")
    if (keystoreFile.exists()) keystoreProps.load(new FileInputStream(keystoreFile))

    def envKeystore = System.getenv("ANDROC_KEYSTORE") ?: System.getenv("ADIA_KEYSTORE")
    def envStorePass = System.getenv("ANDROC_KEYSTORE_PASS") ?: System.getenv("ADIA_KEYSTORE_PASS")
    def envAlias = System.getenv("ANDROC_KEY_ALIAS") ?: System.getenv("ADIA_KEY_ALIAS")
    def envKeyPass = System.getenv("ANDROC_KEY_PASS") ?: System.getenv("ADIA_KEY_PASS")
    def hasEnvSigning = envKeystore != null && envAlias != null
    def requireSigning = androcRequireSigning
    if (requireSigning && !hasEnvSigning && !keystoreFile.exists()) {
        throw new GradleException(
            "Release signing is required: set ANDROC_KEYSTORE/ANDROC_KEY_ALIAS/" +
            "ANDROC_KEYSTORE_PASS/ANDROC_KEY_PASS or provide keystore.properties")
    }

    signingConfigs {
        release {
            if (hasEnvSigning) {
                storeFile file(envKeystore)
                storePassword envStorePass
                keyAlias envAlias
                keyPassword envKeyPass
            } else if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    // Distribution flavors: the only two products.
    //   bundle = UI + bundled OpenCode runtime/assets (offline, heavy)
    //   thin   = UI only; OpenCode and plugins are downloaded from the market
    flavorDimensions "distribution"
    productFlavors {
        bundle {
            dimension "distribution"
            buildConfigField "boolean", "THIN", "false"
        }
        thin {
            dimension "distribution"
            buildConfigField "boolean", "THIN", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        // App 4.0.x (Next): runtime embebido, sin Termux, con paquete aparte.
        // Se firma con la clave de release.
        beta {
            initWith release
            matchingFallbacks = ['release']
            applicationIdSuffix ".beta"
            versionNameSuffix "-beta"
            buildConfigField "int", "SERVER_PORT", "4098"
            signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            buildConfigField "int", "SERVER_PORT", "4098"
            // 只有自己的签名才配得上这个权限，正式版插件不会误连到 debug 壳。
            manifestPlaceholders["pluginPermission"] = "com.a2heng.androc.debug.permission.PLUGIN"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/*.so']
        }
    }
}

dependencies {
    implementation project(':ui')
    implementation project(':market')
    // El tema del cliente usa Theme.SplashScreen; sus attrs deben entrar en el APK.
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Descompresion xz en Java: Android no trae el binario xz y el tar de
    // Toybox lo necesita para los .deb de Termux.
    implementation 'org.tukaani:xz:1.10'
    implementation 'org.apache.commons:commons-compress:1.26.2'
}
