plugins {
    id 'com.android.library'
}

// On-device opencode kernel: opencode binary, proot, Termux prefix, server
// lifecycle, auth/pairing, workspace and self-healing. No UI, no Android SDK.
android {
    namespace 'com.a2heng.androc.kernel'
    compileSdk 37

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    api project(':contracts')
}
