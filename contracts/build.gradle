plugins {
    id 'com.android.library'
}

// The only compile-time API shared by the UI, kernel, tools and product apps.
// No Android runtime dependencies: keep this module tiny and stable.
android {
    namespace 'com.a2heng.androc.contracts'
    compileSdk 37

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
