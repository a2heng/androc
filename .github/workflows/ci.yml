name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "reference/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK platforms
        run: |
          yes | sdkmanager "platforms;android-34" "platforms;android-36" "platforms;android-37.0" "build-tools;34.0.0" "build-tools;36.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check opencode pin (advisory)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-opencode-latest.py

      - name: Fetch opencode runtime
        run: python3 scripts/fetch-opencode.py

      - name: Fetch bundled runtime-core
        run: python3 scripts/fetch-runtime-core.py

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleThinDebug :app:assembleBundleDebug --console=plain --stacktrace --no-daemon

      - name: 16 KB check
        env:
          ANDROC_16KB_STRICT: "1"
        run: |
          python3 scripts/check-16kb.py \
            app/build/outputs/apk/*/debug/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: androc-debug
          path: app/build/outputs/apk/*/debug/*.apk
          if-no-files-found: error
